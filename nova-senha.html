<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CRV PDV — Nova Senha</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/nova-senha.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <main class="reset-page">
    <section class="reset-card">

      <img src="assets/logo1.png" alt="CRV PDV" class="reset-logo" />

      <h1>Redefinir senha</h1>
      <p>Digite sua nova senha para concluir a recuperação de acesso.</p>

      <div class="form-group">
        <label for="novaSenha">Nova senha</label>
        <input type="password" id="novaSenha" placeholder="Digite a nova senha" />
      </div>

      <div class="form-group">
        <label for="confirmarSenha">Confirmar senha</label>
        <input type="password" id="confirmarSenha" placeholder="Confirme a nova senha" />
      </div>

      <div id="feedbackSenha" class="feedback"></div>

      <button id="btnSalvarSenha" class="btn-primary btn-reset">
        <span>Salvar nova senha</span>
      </button>

      <a href="index.html" class="link-voltar">Voltar ao login</a>

    </section>
  </main>

  <script src="js/supabase.js"></script>
  <script src="js/nova-senha.js"></script>

</body>
</html>
